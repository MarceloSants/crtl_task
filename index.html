<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager PWA</title>
  <meta name="theme-color" content="#007AFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Friendly Rounded Font: Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo-container">
      <!-- Replace the <img> tag below with your SVG code -->
      <img src="app_logo.svg" alt="CTRL Tasks Logo">
    </div>
    <button class="btn-primary" onclick="openModal()">+ New Task</button>
  </header>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search tasks..." oninput="render()">
    <div style="display: flex; gap: 8px;">
      <select id="sortSelect" onchange="render()">
        <option value="dueDate">Sort by Due Date</option>
        <option value="createdAt">Sort by Created Date</option>
        <option value="title">Sort Alphabetically</option>
      </select>
      <button class="btn-secondary" onclick="openTagModal()">Tags</button>
    </div>
  </div>

  <div class="tags-bar" id="tagFilterBar"></div>

  <div class="tabs">
    <div class="tab active" id="tabUpcoming" onclick="setTab(false)">Upcoming</div>
    <div class="tab" id="tabCompleted" onclick="setTab(true)">Completed</div>
  </div>

  <div id="taskList"></div>

  <!-- Task Modal -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal">
      <h2 id="modalTitle">New Task</h2>
      <input type="text" id="taskTitleInput" placeholder="Task Title">
      <textarea id="taskNotesInput" placeholder="Notes (optional)"></textarea>
      <input type="date" id="taskDueDateInput">
      
      <!-- General Tags Selection -->
      <label style="font-size: 0.85rem; font-weight: 600; color: #64748b;">General Tags (Multiple):</label>
      <div id="taskTagSelector" style="display: flex; flex-wrap: wrap; gap: 6px;"></div>

      <!-- Place Tag Selection (Single) -->
      <label style="font-size: 0.85rem; font-weight: 600; color: #64748b; margin-top: 4px;">📍 Place Tag (Only One):</label>
      <select id="taskPlaceSelect" style="margin-bottom: 4px;"></select>

      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn-primary" onclick="saveTask()">Save</button>
      </div>
    </div>
  </div>

  <!-- Tag Modal (General & Place Tags) -->
  <div class="modal-overlay" id="tagModal">
    <div class="modal">
      <h2>Manage Tags</h2>
      
      <!-- Tag Type Switcher -->
      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <label style="font-size: 0.85rem; font-weight: 600;"><input type="radio" name="tagType" value="general" checked onchange="switchTagType(this.value)"> General Tag</label>
        <label style="font-size: 0.85rem; font-weight: 600;"><input type="radio" name="tagType" value="place" onchange="switchTagType(this.value)"> 📍 Place Tag</label>
      </div>

      <input type="text" id="newTagName" placeholder="Tag Name">
      
      <label style="font-size: 0.85rem; font-weight: 600; color: #64748b;">Color:</label>
      <div id="colorPickerSwatches" style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px;"></div>
      
      <button class="btn-primary" onclick="addTag()">Add Tag</button>
      
      <h3 style="font-size: 0.95rem; margin-top: 12px; color: #475569;">Existing Tags</h3>
      <div id="tagManagerList" style="display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto;"></div>
      
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeTagModal()">Close</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
